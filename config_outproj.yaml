model: "Qwen/Qwen3.5-9B"
output_dir: "~/models/Qwen--Qwen3.5-9B-outproj"

inference:
  device: "cuda"
  batch_size: 8
  max_lengh: 512
  flash_attn: false

measurements:
  # 測定を再利用するため保存（config.yaml との違いはここだけ + out_proj 対応のソース修正）
  save_path: "./eval_out/measurements_qwen35_9b.pt"
  harmful_prompts: "./data/harmful.parquet"
  harmless_prompts: "./data/harmless.parquet"
  clip: 1.0

ablation:
  method: "full"
  sparsify_method: "percentile"
  quantile: 0.995
  magnitude_threshold: 0.05
  top_k: 3
  global_scale: 1.0
  layer_overrides:
    24:
      scale: 0.5
      source_layer: 23
